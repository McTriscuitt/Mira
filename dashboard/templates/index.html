<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mira</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar { display: none; }

    body {
      font-family: system-ui, sans-serif;
      background: #0d0d0d;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 40px 32px;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    .wordmark {
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 0.15em;
      color: #f0f0f0;
    }

    .logout-footer {
      position: fixed;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
    }

    .logout {
      font-size: 12px;
      color: #555;
      text-decoration: none;
      letter-spacing: 0.05em;
    }
    .logout:hover { color: #888; }

    /* --- Stat grid --- */
    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 2px;
      margin-bottom: 2px;
    }

    .stat {
      background: #141414;
      padding: 20px 18px;
      min-width: 0;
    }

    .stat-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      color: #555;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 26px;
      font-weight: 300;
      color: #e0e0e0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stat-value.state { font-size: 16px; letter-spacing: 0.05em; }

    /* --- Progress block --- */
    .progress-block {
      background: #141414;
      padding: 28px 24px;
      margin-bottom: 48px;
      text-align: center;
    }

    .progress-state-name {
      font-size: 18px;
      font-weight: 300;
      color: #e0e0e0;
      letter-spacing: 0.1em;
      margin-bottom: 14px;
    }

    .progress-slider-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 8px;
    }

    .progress-slider-wrap.hidden { display: none; }

    input[type="range"] {
      -webkit-appearance: none;
      width: 260px;
      height: 2px;
      background: #2a2a2a;
      outline: none;
      cursor: pointer;
      border-radius: 1px;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #666;
      cursor: pointer;
      transition: background 0.15s;
    }

    input[type="range"]::-webkit-slider-thumb:hover { background: #e0e0e0; }
    input[type="range"]::-moz-range-thumb {
      width: 12px; height: 12px; border-radius: 50%;
      background: #666; border: none; cursor: pointer;
    }

    .progress-text {
      font-size: 12px;
      color: #555;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .finish-btn {
      background: none;
      border: 1px solid #2a2a2a;
      color: #555;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.08em;
      padding: 5px 12px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .finish-btn:hover { border-color: #666; color: #e0e0e0; }

    /* --- Controls --- */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 48px;
      justify-content: center;
    }

    .btn {
      background: none;
      border: 1px solid #2a2a2a;
      color: #888;
      font-family: inherit;
      font-size: 12px;
      letter-spacing: 0.08em;
      padding: 10px 20px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      min-height: 40px;
    }
    .btn:hover { border-color: #555; color: #e0e0e0; }
    .btn:active { background: #1a1a1a; }
    .btn.btn-active { border-color: #888; color: #e0e0e0; }

    /* --- Log --- */
    .log-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      color: #555;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .log-list {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .log-entry {
      background: #141414;
      padding: 10px 14px;
      font-size: 13px;
      color: #888;
      display: flex;
      gap: 16px;
    }

    .log-time { color: #444; white-space: nowrap; flex-shrink: 0; }

    /* --- Mobile --- */
    @media (max-width: 600px) {
      body { padding: 24px 16px; }
      .wordmark { font-size: 22px; }
      .btn { padding: 12px 16px; }
      input[type="range"] { width: 180px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wordmark">Mira</div>
  </header>

  <div class="logout-footer">
    <a href="/logout" class="logout">logout</a>
  </div>

  <div class="status-grid">
    <div class="stat">
      <div class="stat-label">State</div>
      <div class="stat-value state" id="val-state">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Lux</div>
      <div class="stat-value" id="val-lux">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Bri</div>
      <div class="stat-value" id="val-bri">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">CT</div>
      <div class="stat-value" id="val-ct">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Overhead</div>
      <div class="stat-value" id="val-overhead">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Last seen</div>
      <div class="stat-value" id="val-ts" style="font-size:14px; padding-top:4px;">—</div>
    </div>
  </div>

  <div class="progress-block">
    <div class="progress-state-name" id="progress-state-name">—</div>
    <div class="progress-slider-wrap hidden" id="progress-slider-wrap">
      <input type="range" id="progress-slider" min="0" max="100" value="0">
      <span class="progress-text" id="progress-text">—</span>
      <button class="finish-btn" id="finish-btn">finish</button>
    </div>
    <div class="progress-text" id="progress-detail"></div>
  </div>

  <div class="controls">
    <button class="btn" data-action="NORMAL"     onclick="sendCommand('NORMAL')">Normal</button>
    <button class="btn" data-action="SOFT_PAUSE" onclick="sendCommand('SOFT_PAUSE')">Soft pause</button>
    <button class="btn" data-action="WIND_DOWN"  onclick="sendCommand('WIND_DOWN')">Wind down</button>
    <button class="btn" data-action="WAKE"       onclick="sendCommand('WAKE')">Wake</button>
    <button class="btn" data-action="HARD_OFF"   onclick="sendCommand('HARD_OFF')">Hard off</button>
  </div>

  <div class="log-section">
    <div class="log-label">Event log</div>
    <div class="log-list" id="log-list"></div>
  </div>

  <script>
    let _lastData = null;
    let _pendingCommand = null;

    const STATE_LABELS = {
      NORMAL:     'Normal',
      WAKE:       'Wake',
      WIND_DOWN:  'Wind Down',
      SOFT_PAUSE: 'Soft Pause',
      LOCKED_OUT: 'Locked Out',
      HARD_OFF:   'Hard Off',
    };

    async function fetchStatus() {
      const response = await fetch('/api/status/latest');
      const data = await response.json();
      if (!data) return;
      _lastData = data;
      document.getElementById('val-state').textContent = STATE_LABELS[data.state] || data.state;
      document.getElementById('val-lux').textContent = Math.round(data.lux);
      document.getElementById('val-bri').textContent = `${data.bri} · ${Math.round(data.bri / 254 * 100)}%`;
      document.getElementById('val-ct').textContent = data.ct;
      document.getElementById('val-overhead').textContent = data.overhead_on ? 'on' : 'off';
      document.getElementById('val-ts').textContent = new Date(data.timestamp).toLocaleTimeString();
      renderProgress(data);
      _pendingCommand = null;
      _updateButtonStates();
    }

    async function fetchLog() {
      const response = await fetch('/api/log/recent');
      const data = await response.json();
      if (!data) return;
      document.getElementById('log-list').innerHTML = '';
      data.forEach(entry => {
        const el = document.createElement('div');
        el.className = 'log-entry';
        el.innerHTML = `<span class="log-time">${new Date(entry.timestamp).toLocaleTimeString()}</span><span>${entry.message}</span>`;
        document.getElementById('log-list').appendChild(el);
      });
    }

    // TODO(human): implement renderProgress(data)
    // data fields: state, wind_down_step (0–120, 30s/step = 60 min total),
    //              wake_step, wake_total, soft_pause_remaining_s
    // Elements to update:
    //   #progress-state-name — the main label (e.g. "Wind-down", "Waking up")
    //   #progress-text — step detail shown beside the slider (e.g. "15 / 60 min")
    //   #progress-detail — shown when no slider (e.g. "42 min remaining")
    //   #progress-slider-wrap — add/remove class "hidden" to show/hide slider
    //   #progress-slider — set .max and .value to position the slider
    // States with a seekable slider: WIND_DOWN, WAKE
    // States with detail text only: SOFT_PAUSE
    // States with just a label: NORMAL, LOCKED_OUT, HARD_OFF


    function renderProgress(data) {
      const nameEl     = document.getElementById('progress-state-name');
      const sliderWrap = document.getElementById('progress-slider-wrap');
      const slider     = document.getElementById('progress-slider');
      const text       = document.getElementById('progress-text');
      const detail     = document.getElementById('progress-detail');

      // Reset to hidden slider and no detail text each call
      sliderWrap.classList.add('hidden');
      detail.textContent = '';

      if (data.state === 'WIND_DOWN') {
        nameEl.textContent = 'Wind-down';
        slider.max   = 120;
        slider.value = data.wind_down_step;
        text.textContent = `${Math.round(data.wind_down_step / 2)} / 60 min`;
        sliderWrap.classList.remove('hidden');

      } else if (data.state === 'WAKE') {
        nameEl.textContent = 'Waking up';
        slider.max   = data.wake_total;
        slider.value = data.wake_step;
        text.textContent = `${data.wake_step} / ${data.wake_total} steps`;
        sliderWrap.classList.remove('hidden');

      } else if (data.state === 'SOFT_PAUSE') {
        nameEl.textContent = 'Paused';
        detail.textContent = `${Math.round(data.soft_pause_remaining_s / 60)} min remaining`;

      } else if (data.state === 'NORMAL') {
        nameEl.textContent = 'Normal';
      } else if (data.state === 'LOCKED_OUT') {
        nameEl.textContent = 'Locked out';
      } else if (data.state === 'HARD_OFF') {
        nameEl.textContent = 'Hard off';
      }
    }

    // Slider seek — fires when user releases the slider
    document.getElementById('progress-slider').addEventListener('change', function () {
      if (!_lastData) return;
      const val = parseInt(this.value);
      if (_lastData.state === 'WIND_DOWN') {
        sendCommand('SET_WIND_DOWN_STEP', val);
      } else if (_lastData.state === 'WAKE') {
        sendCommand('SET_WAKE_STEP', val);
      }
    });

    // Finish button — jumps to end of current sequence
    document.getElementById('finish-btn').addEventListener('click', function () {
      if (!_lastData) return;
      if (_lastData.state === 'WIND_DOWN') sendCommand('SET_WIND_DOWN_STEP', 119);
      else if (_lastData.state === 'WAKE') sendCommand('SET_WAKE_STEP', _lastData.wake_total - 1);
    });

    function _updateButtonStates() {
      document.querySelectorAll('.btn[data-action]').forEach(btn => {
        const active = _pendingCommand && btn.dataset.action === _pendingCommand.action;
        btn.classList.toggle('btn-active', active);
      });
    }

    async function sendCommand(action, value = null) {
      if (_pendingCommand && _pendingCommand.action === action) {
        await fetch(`/api/command/${_pendingCommand.id}/cancel`, { method: 'POST' });
        _pendingCommand = null;
        _updateButtonStates();
        return;
      }
      const body = { action };
      if (value !== null) body.value = value;
      const res = await fetch('/api/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      _pendingCommand = { action, id: data.id };
      _updateButtonStates();
    }

    fetchStatus();
    fetchLog();
    setInterval(fetchStatus, 30000);
    setInterval(fetchLog, 30000);
  </script>
</body>
</html>
