<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mira</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar { display: none; }

    body {
      font-family: system-ui, sans-serif;
      background: #0d0d0d;
      background: #0d0d0d;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 56px 32px 40px;
      overflow-x: hidden;
    }

    /* --- Background letter layer --- */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-cone {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 55% 100% at 50% 0%, rgba(255, 235, 175, 1.0) 0%, rgba(255, 235, 175, 0.65) 35%, rgba(255, 235, 175, 0.3) 65%, rgba(255, 235, 175, 0.08) 100%);
      clip-path: polygon(40% 0%, 60% 0%, 70% 56%, 30% 56%);
      opacity: 0;
      transition: opacity 2s ease;
    }

    .bg-letter {
      position: absolute;
      left: 50%;
      top: 48%;
      transform: translateX(-50%);
      font-size: clamp(28px, 4.5vw, 64px);
      font-weight: 100;
      color: #ffffff;
      letter-spacing: 0.6em;
      padding-left: 0.7em;
      white-space: nowrap;
      line-height: 1;
      opacity: 0;
      transition: opacity 2s ease;
      user-select: none;
    }

    /* --- Content layer --- */
    main {
      position: relative;
      z-index: 1;
      min-height: calc(100vh - 96px);
      display: flex;
      flex-direction: column;
    }

    .logout-footer {
      text-align: center;
      padding: 48px 0 32px;
      margin-top: auto;
    }

    .logout {
      font-size: 12px;
      color: #555;
      text-decoration: none;
      letter-spacing: 0.05em;
    }
    @media (hover: hover) { .logout:hover { color: #888; } }

    /* --- Stat grid --- */
    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 2px;
      margin-bottom: 2px;
    }

    .stat {
      background: #141414;
      padding: 20px 18px;
      min-width: 0;
    }

    .stat-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      color: #555;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 26px;
      font-weight: 300;
      color: #e0e0e0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* --- Progress block --- */
    .progress-block {
      background: #141414;
      padding: 28px 24px;
      margin-bottom: 48px;
      text-align: center;
    }

    .progress-state-name {
      font-size: 18px;
      font-weight: 300;
      color: #e0e0e0;
      letter-spacing: 0.1em;
      margin-bottom: 14px;
    }

    .progress-slider-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 8px;
    }

    .progress-slider-wrap.hidden { display: none; }

    input[type="range"] {
      -webkit-appearance: none;
      width: 260px;
      height: 2px;
      background: #2a2a2a;
      outline: none;
      cursor: pointer;
      border-radius: 1px;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #666;
      cursor: pointer;
      transition: background 0.15s;
    }

    @media (hover: hover) {
      input[type="range"]::-webkit-slider-thumb:hover { background: #e0e0e0; }
    }
    input[type="range"]::-moz-range-thumb {
      width: 12px; height: 12px; border-radius: 50%;
      background: #666; border: none; cursor: pointer;
    }

    .progress-text {
      font-size: 12px;
      color: #555;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .finish-btn {
      background: none;
      border: 1px solid #2a2a2a;
      color: #555;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.08em;
      padding: 5px 12px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    @media (hover: hover) {
      .finish-btn:hover { border-color: #666; color: #e0e0e0; }
    }

    /* --- Controls --- */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 48px;
      justify-content: center;
    }

    .btn {
      background: none;
      border: 1px solid var(--btn-border, #2a2a2a);
      color: var(--btn-text, #888);
      font-family: inherit;
      font-size: 12px;
      letter-spacing: 0.08em;
      padding: 10px 20px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      min-height: 40px;
    }
    @media (hover: hover) {
      .btn:hover { border-color: #555; color: #e0e0e0; }
    }
    .btn:active { background: #1a1a1a; }
    .btn.btn-active { border-color: #777; color: #e0e0e0; background: #1e1e1e; }

    /* --- Log --- */
    .log-section {
      margin-top: max(24px, calc(52vh - 340px));
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
    }

    .log-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      color: #555;
      text-transform: uppercase;
    }

    .log-view-all {
      font-size: 11px;
      color: #444;
      text-decoration: none;
      letter-spacing: 0.05em;
    }
    @media (hover: hover) { .log-view-all:hover { color: #888; } }

    .log-list {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .log-entry {
      background: #141414;
      padding: 10px 14px;
      font-size: 13px;
      color: #888;
      display: flex;
      gap: 16px;
    }

    .log-time { color: #444; white-space: nowrap; flex-shrink: 0; }

    /* --- Mobile --- */
    @media (max-width: 600px) {
      body { padding: 40px 16px; }
      .btn { padding: 12px 16px; }
      input[type="range"] { width: 180px; }
    }
  </style>
</head>
<body>
  <div class="bg-layer" aria-hidden="true">
    <div class="bg-cone"></div>
    <span class="bg-letter">MIRA</span>
  </div>

  <main>
    <div class="status-grid">
      <div class="stat">
        <div class="stat-label">Lux</div>
        <div class="stat-value" id="val-lux">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Bri</div>
        <div class="stat-value" id="val-bri">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">CT</div>
        <div class="stat-value" id="val-ct">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Overhead</div>
        <div class="stat-value" id="val-overhead">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Last seen</div>
        <div class="stat-value" id="val-ts" style="font-size:14px; padding-top:4px;">—</div>
      </div>
    </div>

    <div class="progress-block">
      <div class="progress-state-name" id="progress-state-name">—</div>
      <div class="progress-slider-wrap hidden" id="progress-slider-wrap">
        <input type="range" id="progress-slider" min="0" max="100" value="0">
        <span class="progress-text" id="progress-text">—</span>
        <button class="finish-btn" id="finish-btn">finish</button>
      </div>
      <div class="progress-text" id="progress-detail"></div>
    </div>

    <div class="controls">
      <button class="btn" data-action="NORMAL"     onclick="sendCommand('NORMAL')">Normal</button>
      <button class="btn" data-action="SOFT_PAUSE" onclick="sendCommand('SOFT_PAUSE')">Soft pause</button>
      <button class="btn" data-action="WIND_DOWN"  onclick="sendCommand('WIND_DOWN')">Wind down</button>
      <button class="btn" data-action="WAKE"       onclick="sendCommand('WAKE')">Wake</button>
      <button class="btn" data-action="HARD_OFF"   onclick="sendCommand('HARD_OFF')">Hard off</button>
    </div>

    <div class="log-section">
      <div class="log-header">
        <div class="log-label">Event log</div>
        <a href="/logs" class="log-view-all">view all</a>
      </div>
      <div class="log-list" id="log-list"></div>
    </div>

    <div class="logout-footer">
      <a href="/logout" class="logout">logout</a>
    </div>
  </main>

  <script>
    let _lastData = null;
    let _pendingCommand = null;

    const STATE_LABELS = {
      NORMAL:     'Normal',
      WAKE:       'Wake',
      WIND_DOWN:  'Wind Down',
      SOFT_PAUSE: 'Soft Pause',
      LOCKED_OUT: 'Locked Out',
      HARD_OFF:   'Hard Off',
    };

    const STATE_CMDS = new Set(['NORMAL', 'WAKE', 'WIND_DOWN', 'SOFT_PAUSE', 'HARD_OFF']);

    function updateLetterOpacity(letters, lux) {
      const maxLux = 2000;
      const t = Math.min(1, Math.max(0, lux / maxLux));
      const letterOpacity = t * 0.14;
      const coneOpacity = Math.min(1, lux / 1000) * 0.85;
      letters.forEach(el => el.style.opacity = letterOpacity);
      document.querySelector('.bg-cone').style.opacity = coneOpacity;
      const ct = Math.min(1, lux / 1000);
      const textV   = Math.round(136 * (1 - ct) + 40 * ct);  // #888 → #282828
      const borderV = Math.round(42  * (1 - ct) + 80 * ct);  // #2a2a2a → #505050
      document.documentElement.style.setProperty('--btn-text',   `rgb(${textV},${textV},${textV})`);
      document.documentElement.style.setProperty('--btn-border',`rgb(${borderV},${borderV},${borderV})`);
    }

    async function fetchStatus() {
      const response = await fetch('/api/status/latest');
      const data = await response.json();
      if (!data) return;
      _lastData = data;
      const sentinel = data.ct === 0;
      document.getElementById('val-lux').textContent = Math.round(data.lux);
      document.getElementById('val-bri').textContent = sentinel ? '—' : `${data.bri} · ${Math.round(data.bri / 254 * 100)}%`;
      document.getElementById('val-ct').textContent = sentinel ? '—' : data.ct;
      document.getElementById('val-overhead').textContent = sentinel ? '—' : (data.overhead_on ? 'on' : 'off');
      document.getElementById('val-ts').textContent = new Date(data.timestamp).toLocaleTimeString();
      if (_pendingCommand && data.pending_command_id !== _pendingCommand.id) {
        _pendingCommand = null;
      }
      _updateButtonStates();
      renderProgress(data);
      updateLetterOpacity(document.querySelectorAll('.bg-letter'), data.lux);
    }

    async function fetchLog() {
      const response = await fetch('/api/log/recent?limit=10');
      const data = await response.json();
      if (!data) return;
      document.getElementById('log-list').innerHTML = '';
      data.forEach(entry => {
        const el = document.createElement('div');
        el.className = 'log-entry';
        el.innerHTML = `<span class="log-time">${new Date(entry.timestamp).toLocaleTimeString()}</span><span>${entry.message}</span>`;
        document.getElementById('log-list').appendChild(el);
      });
    }

    function renderProgress(data) {
      if (!data) return;
      const nameEl     = document.getElementById('progress-state-name');
      const sliderWrap = document.getElementById('progress-slider-wrap');
      const slider     = document.getElementById('progress-slider');
      const text       = document.getElementById('progress-text');
      const detail     = document.getElementById('progress-detail');

      sliderWrap.classList.add('hidden');
      detail.textContent = '';

      const isPending = _pendingCommand && STATE_CMDS.has(_pendingCommand.action);
      const displayState = isPending ? _pendingCommand.action : data.state;

      if (displayState === 'WIND_DOWN') {
        nameEl.textContent = 'Wind-down';
        const step = isPending ? (_pendingCommand.value ?? 0) : data.wind_down_step;
        slider.max   = 120;
        slider.value = step;
        text.textContent = `${Math.round(step / 2)} / 60 min`;
        sliderWrap.classList.remove('hidden');
        if (isPending) detail.textContent = 'pending';

      } else if (displayState === 'WAKE') {
        nameEl.textContent = 'Waking up';
        const total = data.wake_total || 40;
        const step  = isPending ? (_pendingCommand.value ?? 0) : data.wake_step;
        slider.max   = total;
        slider.value = step;
        text.textContent = `${step} / ${total} steps`;
        sliderWrap.classList.remove('hidden');
        if (isPending) detail.textContent = 'pending';

      } else if (displayState === 'SOFT_PAUSE') {
        nameEl.textContent = 'Paused';
        detail.textContent = isPending
          ? 'pending'
          : `${Math.round(data.soft_pause_remaining_s / 60)} min remaining`;

      } else if (displayState === 'NORMAL') {
        nameEl.textContent = 'Normal';
        if (isPending) detail.textContent = 'pending';
      } else if (displayState === 'LOCKED_OUT') {
        nameEl.textContent = 'Locked out';
      } else if (displayState === 'HARD_OFF') {
        nameEl.textContent = 'Hard off';
        if (isPending) detail.textContent = 'pending';
      }
    }

    document.getElementById('progress-slider').addEventListener('change', function () {
      if (!_lastData) return;
      const val = parseInt(this.value);
      const previewAction = _pendingCommand && STATE_CMDS.has(_pendingCommand.action) ? _pendingCommand.action : null;
      if (previewAction === 'WIND_DOWN') {
        sendCommand('WIND_DOWN', val);
      } else if (previewAction === 'WAKE') {
        sendCommand('WAKE', val);
      } else if (_lastData.state === 'WIND_DOWN') {
        sendCommand('SET_WIND_DOWN_STEP', val);
      } else if (_lastData.state === 'WAKE') {
        sendCommand('SET_WAKE_STEP', val);
      }
    });

    document.getElementById('progress-slider').addEventListener('input', function () {
      if (!_lastData) return;
      const val = parseInt(this.value);
      const previewAction = _pendingCommand && STATE_CMDS.has(_pendingCommand.action) ? _pendingCommand.action : null;
      const activeState = previewAction || _lastData.state;
      if (activeState === 'WIND_DOWN') {
        document.getElementById('progress-text').textContent = `${Math.round(val / 2)} / 60 min`;
      } else if (activeState === 'WAKE') {
        document.getElementById('progress-text').textContent = `${val} / ${_lastData.wake_total || 40} steps`;
      }
    });

    document.getElementById('finish-btn').addEventListener('click', function () {
      if (!_lastData) return;
      const previewAction = _pendingCommand && STATE_CMDS.has(_pendingCommand.action) ? _pendingCommand.action : null;
      const activeState = previewAction || _lastData.state;
      if (activeState === 'WIND_DOWN') {
        sendCommand(previewAction || 'SET_WIND_DOWN_STEP', 119);
      } else if (activeState === 'WAKE') {
        sendCommand(previewAction || 'SET_WAKE_STEP', (_lastData.wake_total || 40) - 1);
      }
    });

    function _updateButtonStates() {
      document.querySelectorAll('.btn[data-action]').forEach(btn => {
        const active = _pendingCommand && STATE_CMDS.has(_pendingCommand.action)
          && btn.dataset.action === _pendingCommand.action;
        btn.classList.toggle('btn-active', active);
      });
    }

    async function sendCommand(action, value = null) {
      const isSameAction = _pendingCommand && _pendingCommand.action === action;

      if (isSameAction && value === null) {
        await fetch(`/api/command/${_pendingCommand.id}/cancel`, { method: 'POST' });
        _pendingCommand = null;
        _updateButtonStates();
        renderProgress(_lastData);
        return;
      }

      if (_pendingCommand) {
        await fetch(`/api/command/${_pendingCommand.id}/cancel`, { method: 'POST' });
        _pendingCommand = null;
      }

      const body = { action };
      if (value !== null) body.value = value;
      const res = await fetch('/api/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const cmd = await res.json();
      _pendingCommand = { action, id: cmd.id, value };
      _updateButtonStates();
      renderProgress(_lastData);
    }

    fetchStatus();
    fetchLog();
    setInterval(fetchStatus, 30000);
    setInterval(fetchLog, 30000);
  </script>
</body>
</html>
