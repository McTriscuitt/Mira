<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mira</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar { display: none; }

    body {
      font-family: system-ui, sans-serif;
      background: #0d0d0d;
      background: #0d0d0d;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 56px 32px 40px;
      overflow-x: hidden;
    }

    /* --- Background letter layer --- */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-cone {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 55% 100% at 50% 0%, rgba(255, 235, 175, 1.0) 0%, rgba(255, 235, 175, 0.65) 35%, rgba(255, 235, 175, 0.3) 65%, rgba(255, 235, 175, 0.08) 100%);
      clip-path: polygon(40% 0%, 60% 0%, 70% 56%, 30% 56%);
      opacity: 0;
      transition: opacity 2s ease;
    }

    .bg-letter {
      position: absolute;
      left: 50%;
      top: 48%;
      transform: translateX(-50%);
      font-size: clamp(28px, 4.5vw, 64px);
      font-weight: 100;
      color: #ffffff;
      letter-spacing: 0.6em;
      padding-left: 0.7em;
      white-space: nowrap;
      line-height: 1;
      opacity: 0;
      transition: opacity 2s ease;
      user-select: none;
    }

    /* --- Content layer --- */
    main {
      position: relative;
      z-index: 1;
      min-height: calc(100vh - 96px);
      display: flex;
      flex-direction: column;
    }

    .logout-footer {
      text-align: center;
      padding: 48px 0 32px;
      margin-top: auto;
    }

    .logout {
      font-size: 12px;
      color: #555;
      text-decoration: none;
      letter-spacing: 0.05em;
    }
    @media (hover: hover) { .logout:hover { color: #888; } }

    .hidden-nav {
      position: fixed;
      left: 70%;
      top: 56%;
      width: 28px;
      height: 28px;
      z-index: 2;
      cursor: default;
    }

    /* --- Stat grid --- */
    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 2px;
      margin-bottom: 2px;
    }

    .stat {
      background: #141414;
      padding: 20px 18px;
      min-width: 0;
    }

    .stat-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      color: #555;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 26px;
      font-weight: 300;
      color: #e0e0e0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* --- Progress block --- */
    .progress-block {
      background: #141414;
      padding: 28px 24px;
      margin-bottom: 48px;
      text-align: center;
    }

    .progress-state-name {
      font-size: 18px;
      font-weight: 300;
      color: #e0e0e0;
      letter-spacing: 0.1em;
      margin-bottom: 14px;
    }

    .progress-slider-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 8px;
    }

    .progress-slider-wrap.hidden { display: none; }

    input[type="range"] {
      -webkit-appearance: none;
      width: 260px;
      height: 2px;
      background: #2a2a2a;
      outline: none;
      cursor: pointer;
      border-radius: 1px;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #666;
      cursor: pointer;
      transition: background 0.15s;
    }

    @media (hover: hover) {
      input[type="range"]::-webkit-slider-thumb:hover { background: #e0e0e0; }
    }
    input[type="range"]::-moz-range-thumb {
      width: 12px; height: 12px; border-radius: 50%;
      background: #666; border: none; cursor: pointer;
    }

    .progress-text {
      font-size: 12px;
      color: #555;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .finish-btn {
      background: none;
      border: 1px solid #2a2a2a;
      color: #555;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.08em;
      padding: 5px 12px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    @media (hover: hover) {
      .finish-btn:hover { border-color: #666; color: #e0e0e0; }
    }
    /* Touch devices get no :hover — :active fires on touchstart so the press
       still gives visual feedback. Keep outside the hover media query. */
    .finish-btn:active { border-color: #777; color: #e0e0e0; background: #1a1a1a; }

    /* --- Controls --- */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 48px;
      justify-content: center;
    }

    .btn {
      background: none;
      border: 1px solid var(--btn-border, #2a2a2a);
      color: var(--btn-text, #888);
      font-family: inherit;
      font-size: 12px;
      letter-spacing: 0.08em;
      padding: 10px 20px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      min-height: 40px;
    }
    @media (hover: hover) {
      .btn:hover { border-color: #555; color: #e0e0e0; }
    }
    .btn:active { background: #1a1a1a; }
    .btn.btn-active { border-color: #777; color: #e0e0e0; background: #1e1e1e; }

    /* --- Lights-in-cycle chips --- */
    .lights-section { text-align: center; margin-top: 24px; margin-bottom: 48px; }
    .lights-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      color: #555;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .lights-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .light-chip {
      background: none;
      border: 1px solid #2a2a2a;
      color: #555;
      font-family: inherit;
      font-size: 12px;
      letter-spacing: 0.08em;
      padding: 8px 16px;
      cursor: pointer;
      min-height: 36px;
      transition: border-color 0.15s, color 0.15s, opacity 0.15s;
    }
    @media (hover: hover) { .light-chip:hover { border-color: #555; color: #e0e0e0; } }
    .light-chip:active { background: #1a1a1a; }
    /* lit = participating in the cycle; dimmed = excluded */
    .light-chip.in-cycle { border-color: #777; color: #e0e0e0; background: #1e1e1e; }
    .light-chip.excluded { border-color: #1c1c1c; color: #3c3c3c; opacity: 0.6; }

    /* --- Log --- */
    .log-section {
      margin-top: 0;
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
    }

    .log-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      color: #555;
      text-transform: uppercase;
      text-decoration: none;
    }
    @media (hover: hover) { .log-label:hover { color: #888; } }

    .log-list {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .log-entry {
      background: #141414;
      padding: 10px 14px;
      font-size: 13px;
      color: #888;
      display: flex;
      gap: 16px;
    }

    .log-time { color: #444; white-space: nowrap; flex-shrink: 0; }

    /* --- Lux curve widget --- */
    .lux-curve-section { margin-top: max(24px, calc(52vh - 340px)); margin-bottom: 48px; width: 50%; align-self: center; }

    .lux-curve-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
    }

    .lux-curve-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      color: #555;
      text-transform: uppercase;
      text-decoration: none;
    }
    @media (hover: hover) { .lux-curve-label:hover { color: #888; } }

    #lux-widget-canvas {
      display: block;
      width: 100%;
      height: 76px;
    }

    /* --- Mobile --- */
    @media (max-width: 600px) {
      body { padding: 40px 16px; }
      .btn { padding: 12px 16px; }
      input[type="range"] { width: 180px; }
      .lux-curve-section { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="bg-layer" aria-hidden="true">
    <div class="bg-cone"></div>
    <span class="bg-letter">MIRA</span>
  </div>

  <main>
    <div class="status-grid">
      <div class="stat">
        <div class="stat-label">Lux</div>
        <div class="stat-value" id="val-lux">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Brightness</div>
        <div class="stat-value" id="val-bri">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Color Temperature</div>
        <div class="stat-value" id="val-ct">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Last seen</div>
        <div class="stat-value" id="val-ts" style="font-size:14px; padding-top:4px;">—</div>
      </div>
    </div>

    <div class="progress-block">
      <div class="progress-state-name" id="progress-state-name">—</div>
      <div class="progress-slider-wrap hidden" id="progress-slider-wrap">
        <input type="range" id="progress-slider" min="0" max="100" value="0"{% if role == 'demo' %} disabled style="pointer-events:none"{% endif %}>
        <span class="progress-text" id="progress-text">—</span>
        {% if role != 'demo' %}<button class="finish-btn" id="extend-btn" style="display:none">+10 min</button>{% endif %}
        {% if role != 'demo' %}<button class="finish-btn" id="finish-btn">finish</button>{% endif %}
      </div>
      <div class="progress-text" id="progress-detail"></div>
    </div>

    {% if role != 'demo' %}
    <div class="controls">
      <button class="btn" data-action="NORMAL"     onclick="sendCommand('NORMAL')">Normal</button>
      <button class="btn" data-action="SOFT_PAUSE" onclick="sendCommand('SOFT_PAUSE')">Soft pause</button>
      <button class="btn" data-action="WIND_DOWN"  onclick="sendCommand('WIND_DOWN')">Wind down</button>
      <button class="btn" data-action="WAKE"       onclick="sendCommand('WAKE')">Wake</button>
      <button class="btn" data-action="HARD_OFF"   onclick="hardOffClick()">Hard off</button>
    </div>
    {% endif %}

    <div class="lights-section">
      <div class="lights-label">Lights in cycle</div>
      <div class="lights-row" id="lights-row"{% if role == 'demo' %} style="pointer-events:none;opacity:0.75"{% endif %}>
        <button class="light-chip" data-light="4" onclick="toggleLight(4)">Floor</button>
        <button class="light-chip" data-light="0" onclick="toggleLight(0)">Chest</button>
        <button class="light-chip" data-light="1" onclick="toggleLight(1)">Dresser</button>
        <button class="light-chip" data-light="2" onclick="toggleLight(2)">Ceiling</button>
      </div>
    </div>

    {% if role != 'demo' %}
    <div class="lux-curve-section">
      <div class="lux-curve-header">
        <a href="/lux" class="lux-curve-label">Lux curve</a>
      </div>
      <canvas id="lux-widget-canvas"></canvas>
    </div>
    {% endif %}

    <div class="log-section"{% if role == 'demo' %} style="margin-top: max(200px, calc(52vh - 180px))"{% endif %}>
      <div class="log-header">
        <a href="/logs" class="log-label">Event log</a>
      </div>
      <div class="log-list" id="log-list"></div>
    </div>

    <div class="logout-footer">
      <a href="/logout" class="logout">logout</a>
    </div>
  </main>

  {% if role == 'owner' %}
  <a href="/admin/access-log" class="hidden-nav" aria-hidden="true" tabindex="-1"></a>
  {% endif %}

  <script>
    const READONLY = {{ 'true' if role == 'demo' else 'false' }};
    let _lastData = null;
    let _pendingCommand = null;
    const HARD_OFF_CONFIRM_MS = 3000;
    let _hardOffArmed = false;
    let _hardOffTimer = null;

    const STATE_LABELS = {
      NORMAL:     'Normal',
      WAKE:       'Wake',
      WIND_DOWN:  'Wind Down',
      SOFT_PAUSE: 'Soft Pause',
      LOCKED_OUT: 'Locked Out',
      HARD_OFF:   'Hard Off',
    };

    const STATE_CMDS = new Set(['NORMAL', 'WAKE', 'WIND_DOWN', 'SOFT_PAUSE', 'HARD_OFF']);

    function updateLetterOpacity(letters, lux) {
      const maxLux = 2000;
      const t = Math.min(1, Math.max(0, lux / maxLux));
      const letterOpacity = t * 0.14;
      const coneOpacity = Math.min(1, lux / 1000) * 0.85;
      letters.forEach(el => el.style.opacity = letterOpacity);
      document.querySelector('.bg-cone').style.opacity = coneOpacity;
      const ct = Math.min(1, lux / 1000);
      const textV   = Math.round(136 * (1 - ct) + 40 * ct);  // #888 → #282828
      const borderV = Math.round(42  * (1 - ct) + 80 * ct);  // #2a2a2a → #505050
      document.documentElement.style.setProperty('--btn-text',   `rgb(${textV},${textV},${textV})`);
      document.documentElement.style.setProperty('--btn-border',`rgb(${borderV},${borderV},${borderV})`);
    }

    async function fetchStatus() {
      const response = await fetch('/api/status/latest');
      const data = await response.json();
      if (!data) return;
      _lastData = data;
      const sentinel = data.ct === 0;
      document.getElementById('val-lux').textContent = Math.round(data.lux);
      document.getElementById('val-bri').textContent = sentinel ? '—' : `${data.bri?.toFixed(1) ?? '—'}%`;
      document.getElementById('val-ct').textContent = sentinel ? '—' : data.ct;
      document.getElementById('val-ts').textContent = data.timestamp ? new Date(data.timestamp).toLocaleTimeString('en-US', { timeZone: 'America/Chicago' }) : '—';
      if (_pendingCommand && data.pending_command_id !== _pendingCommand.id) {
        _pendingCommand = null;
      }
      _updateButtonStates();
      renderProgress(data);
      renderLightChips(data);
      updateLetterOpacity(document.querySelectorAll('.bg-letter'), data.lux);
      drawLuxWidget(data.lux, data.state);
    }

    async function fetchLog() {
      const response = await fetch('/api/log/recent?limit=10');
      const data = await response.json();
      if (!data) return;
      document.getElementById('log-list').innerHTML = '';
      data.forEach(entry => {
        const el = document.createElement('div');
        el.className = 'log-entry';
        const timeHtml = entry.timestamp ? `<span class="log-time">${new Date(entry.timestamp).toLocaleTimeString('en-US', { timeZone: 'America/Chicago' })}</span>` : '';
        el.innerHTML = `${timeHtml}<span>${entry.message}</span>`;
        document.getElementById('log-list').appendChild(el);
      });
    }

    function renderProgress(data) {
      if (!data) return;
      const nameEl     = document.getElementById('progress-state-name');
      const sliderWrap = document.getElementById('progress-slider-wrap');
      const slider     = document.getElementById('progress-slider');
      const text       = document.getElementById('progress-text');
      const detail     = document.getElementById('progress-detail');
      const finishBtn  = document.getElementById('finish-btn');
      const extendBtn  = document.getElementById('extend-btn');

      sliderWrap.classList.add('hidden');
      detail.textContent = '';
      // Buttons are per-state: finish for wind-down/wake, extend for soft pause.
      // Reset both each render so a state change can't leave a stale one showing.
      if (finishBtn) { finishBtn.style.display = 'none'; finishBtn.textContent = 'finish'; }
      if (extendBtn) extendBtn.style.display = 'none';

      const isPending = _pendingCommand && STATE_CMDS.has(_pendingCommand.action);
      const displayState = isPending ? _pendingCommand.action : data.state;
      // A step-seek (the finish button or a slider drag) is a non-state command that
      // still only takes effect on the firmware's next poll. Surface it as "pending"
      // and pin the slider to the requested step so it doesn't snap back mid-wait.
      const windSeekPending   = _pendingCommand && _pendingCommand.action === 'SET_WIND_DOWN_STEP';
      const wakeSeekPending   = _pendingCommand && _pendingCommand.action === 'SET_WAKE_STEP';
      const stableSeekPending = _pendingCommand && _pendingCommand.action === 'SET_STABLE_LUX_COUNT';

      if (displayState === 'WIND_DOWN') {
        nameEl.textContent = 'Wind-down';
        let step = data.wind_down_step;
        if (isPending)             step = _pendingCommand.value ?? 0;
        else if (windSeekPending)  step = _pendingCommand.value ?? step;
        slider.max   = 120;
        slider.value = step;
        text.textContent = `${Math.round(step / 2)} / 60 min`;
        sliderWrap.classList.remove('hidden');
        if (finishBtn) finishBtn.style.display = '';
        if (isPending || windSeekPending) detail.textContent = 'pending';

      } else if (displayState === 'WAKE') {
        nameEl.textContent = 'Waking up';
        const total = data.wake_total || 40;
        let step = data.wake_step;
        if (isPending)             step = _pendingCommand.value ?? 0;
        else if (wakeSeekPending)  step = _pendingCommand.value ?? step;
        slider.max   = total;
        slider.value = step;
        text.textContent = `${step} / ${total} steps`;
        sliderWrap.classList.remove('hidden');
        if (finishBtn) finishBtn.style.display = '';
        if (isPending || wakeSeekPending) detail.textContent = 'pending';

      } else if (displayState === 'SOFT_PAUSE') {
        nameEl.textContent = 'Paused';
        if (isPending) {
          // Pause queued but firmware hasn't entered it yet — no remaining time to scrub.
          detail.textContent = 'pending';
        } else {
          // Slider scrubs minutes remaining; max grows past 60 once extended so the
          // thumb never pins. Extend button bumps the displayed value by 10 and
          // resends an absolute target (see extend-btn handler).
          const remMin = Math.max(0, Math.round((data.soft_pause_remaining_s ?? 0) / 60));
          slider.max   = Math.max(60, remMin);
          slider.value = remMin;
          text.textContent = `${remMin} min remaining`;
          sliderWrap.classList.remove('hidden');
          if (extendBtn) extendBtn.style.display = '';
        }

      } else if (displayState === 'NORMAL') {
        nameEl.textContent = 'Normal';
        const stableCount = stableSeekPending
          ? (_pendingCommand.value ?? 0)
          : (data.stable_lux_count ?? 0);
        slider.max   = 59;
        slider.value = stableCount;
        text.textContent = `stable lux: ${stableCount} / 59`;
        sliderWrap.classList.remove('hidden');
        if (finishBtn) { finishBtn.style.display = ''; finishBtn.textContent = 'reset'; }
        if (isPending || stableSeekPending) detail.textContent = 'pending';
      } else if (displayState === 'LOCKED_OUT') {
        nameEl.textContent = 'Locked out';
      } else if (displayState === 'HARD_OFF') {
        nameEl.textContent = 'Hard off';
        if (isPending) detail.textContent = 'pending';
      }
    }

    document.getElementById('progress-slider').addEventListener('change', function () {
      if (!_lastData) return;
      const val = parseInt(this.value);
      const previewAction = _pendingCommand && STATE_CMDS.has(_pendingCommand.action) ? _pendingCommand.action : null;
      if (previewAction === 'WIND_DOWN') {
        sendCommand('WIND_DOWN', val);
      } else if (previewAction === 'WAKE') {
        sendCommand('WAKE', val);
      } else if (_lastData.state === 'WIND_DOWN') {
        sendCommand('SET_WIND_DOWN_STEP', val);
      } else if (_lastData.state === 'WAKE') {
        sendCommand('SET_WAKE_STEP', val);
      } else if (_lastData.state === 'SOFT_PAUSE') {
        sendCommand('SET_SOFT_PAUSE_REMAINING', val);
      } else if (_lastData.state === 'NORMAL') {
        sendCommand('SET_STABLE_LUX_COUNT', val);
      }
    });

    document.getElementById('progress-slider').addEventListener('input', function () {
      if (!_lastData) return;
      const val = parseInt(this.value);
      const previewAction = _pendingCommand && STATE_CMDS.has(_pendingCommand.action) ? _pendingCommand.action : null;
      const activeState = previewAction || _lastData.state;
      if (activeState === 'WIND_DOWN') {
        document.getElementById('progress-text').textContent = `${Math.round(val / 2)} / 60 min`;
      } else if (activeState === 'WAKE') {
        document.getElementById('progress-text').textContent = `${val} / ${_lastData.wake_total || 40} steps`;
      } else if (activeState === 'SOFT_PAUSE') {
        document.getElementById('progress-text').textContent = `${val} min remaining`;
      } else if (activeState === 'NORMAL') {
        document.getElementById('progress-text').textContent = `stable lux: ${val} / 59`;
      }
    });

    document.getElementById('finish-btn')?.addEventListener('click', function () {
      if (!_lastData) return;
      const previewAction = _pendingCommand && STATE_CMDS.has(_pendingCommand.action) ? _pendingCommand.action : null;
      const activeState = previewAction || _lastData.state;
      if (activeState === 'WIND_DOWN') {
        sendCommand(previewAction || 'SET_WIND_DOWN_STEP', 119);
      } else if (activeState === 'WAKE') {
        sendCommand(previewAction || 'SET_WAKE_STEP', (_lastData.wake_total || 40) - 1);
      } else if (activeState === 'NORMAL') {
        sendCommand('SET_STABLE_LUX_COUNT', 0);
      }
    });

    document.getElementById('extend-btn')?.addEventListener('click', function () {
      if (!_lastData || _lastData.state !== 'SOFT_PAUSE') return;
      const slider = document.getElementById('progress-slider');
      // Absolute target = currently displayed remaining + 10. Sending the absolute
      // value (not a relative +10) means rapid taps converge: each tap cancels the
      // prior pending command, and the last absolute value is the correct total.
      const next = (parseInt(slider.value) || 0) + 10;
      slider.max = Math.max(parseInt(slider.max) || 60, next);
      slider.value = next;
      document.getElementById('progress-text').textContent = `${next} min remaining`;
      sendCommand('SET_SOFT_PAUSE_REMAINING', next);
    });

    function _updateButtonStates() {
      document.querySelectorAll('.btn[data-action]').forEach(btn => {
        const active = _pendingCommand && STATE_CMDS.has(_pendingCommand.action)
          && btn.dataset.action === _pendingCommand.action;
        btn.classList.toggle('btn-active', active);
      });
    }

    // Maps a chip's data-light (firmware LIGHT_* cache index) to the /api/status
    // excluded key. Ceiling 2 is unused, so it has no chip.
    const LIGHT_NAMES = { 4: 'floor', 0: 'chest', 1: 'dresser', 2: 'ceiling' };

    function renderLightChips(data) {
      const excl = (data && data.excluded) || {};
      document.querySelectorAll('.light-chip').forEach(chip => {
        const name = LIGHT_NAMES[parseInt(chip.dataset.light)];
        const isExcluded = !!excl[name];
        chip.classList.toggle('excluded', isExcluded);
        chip.classList.toggle('in-cycle', !isExcluded);
      });
    }

    function toggleLight(idx) {
      if (READONLY || !_lastData) return;
      const name = LIGHT_NAMES[idx];
      const currentlyExcluded = !!(_lastData.excluded && _lastData.excluded[name]);
      const action = currentlyExcluded ? 'INCLUDE_LIGHT' : 'EXCLUDE_LIGHT';
      // Optimistic flip so the chip responds instantly; status polling reconciles
      // it with firmware truth on the next tick.
      if (_lastData.excluded) _lastData.excluded[name] = !currentlyExcluded;
      renderLightChips(_lastData);
      // Fire-and-forget — deliberately NOT sendCommand(): its cancel-prior-pending
      // logic would let a second light toggle cancel the first. Each toggle is an
      // independent absolute action keyed to one light, so just queue it.
      fetch('/api/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, value: idx })
      });
    }

    function _cancelHardOff() {
      if (!_hardOffArmed) return;
      _hardOffArmed = false;
      clearTimeout(_hardOffTimer);
      document.querySelector('[data-action="HARD_OFF"]').textContent = 'Hard off';
    }

    function hardOffClick() {
      if (READONLY) return;
      if (!_hardOffArmed) {
        _hardOffArmed = true;
        document.querySelector('[data-action="HARD_OFF"]').textContent = 'confirm?';
        _hardOffTimer = setTimeout(_cancelHardOff, HARD_OFF_CONFIRM_MS);
      } else {
        _cancelHardOff();
        sendCommand('HARD_OFF');
      }
    }

    async function sendCommand(action, value = null) {
      if (READONLY) return;
      if (action !== 'HARD_OFF') _cancelHardOff();
      const isSameAction = _pendingCommand && _pendingCommand.action === action;

      if (isSameAction && value === null) {
        await fetch(`/api/command/${_pendingCommand.id}/cancel`, { method: 'POST' });
        _pendingCommand = null;
        _updateButtonStates();
        renderProgress(_lastData);
        return;
      }

      if (_pendingCommand) {
        await fetch(`/api/command/${_pendingCommand.id}/cancel`, { method: 'POST' });
        _pendingCommand = null;
      }

      const body = { action };
      if (value !== null) body.value = value;
      const res = await fetch('/api/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const cmd = await res.json();
      _pendingCommand = { action, id: cmd.id, value };
      _updateButtonStates();
      renderProgress(_lastData);
    }

    fetchStatus();
    fetchLog();
    setInterval(fetchStatus, 30000);
    setInterval(fetchLog, 30000);

    // ── Lux curve widget ─────────────────────────────────────────────────
    // ── Lux curve math ────────────────────────────────────────────────────
    // CLIENT-SIDE DUPLICATE of src/lightcurve.h — not derived at runtime.
    // If curve constants change in lightcurve.h, update this block and the
    // matching block in lux_curve.html to match. See HANDOFF_v2_migration.md
    // for the full before/after when migrating bri units (v1 → v2 percent).
    const _LC = {
      _log(t, b) { return Math.log(1 + t*(b-1)) / Math.log(b); },
      _crawl(t, p) { const k = 8**p, v = 1-1/(1+t*k), n = 1-1/(1+k); return v/n; },
      calc(lux) {
        lux = Math.max(0, Math.min(lux, 3000));
        let bri;
        if      (lux <= 10)  { bri = 19.7 + 39.4 * this._log(lux/10, 20); }                       // →59.1
        else if (lux <= 250) { const t=(lux-10)/240;   bri = 59.1 + 19.6 * this._crawl(t, 0.5); } // →78.7 (floor+dresser)
        else if (lux <= 500) { const t=(lux-250)/250;  bri = 70.0 + 15.0 * t**5; }                // 70→85 (+chest, disc. at 250)
        else                 { const t=(lux-500)/2500; bri = 69.0 + 31.0 * this._log(t, 4.5); }   // 69→100 (+overheads, disc. at 500)
        const n = (bri - 19.7) / 80.3;
        return { bri, ct: Math.round(400 - 120*n) };
      }
    };

    function drawLuxWidget(currentLux, currentState) {
      const cvs = document.getElementById('lux-widget-canvas');
      if (!cvs || !cvs.clientWidth) return;
      const dpr = window.devicePixelRatio || 1;
      const W = cvs.clientWidth, H = cvs.clientHeight;
      cvs.width = W * dpr; cvs.height = H * dpr;
      const ctx = cvs.getContext('2d');
      ctx.scale(dpr, dpr);

      const px = 12, py = 7;
      const cw = W - 2*px, ch = H - 2*py;
      function lx(l) { return px + Math.log1p(l)/Math.log1p(3000) * cw; }
      function by(b) { return py + ch - (b - 19.7)/80.3 * ch; }

      ctx.fillStyle = '#141414';
      ctx.fillRect(0, 0, W, H);

      // Helper: trace the curve across a lux band, brighter stroke = more bulbs on.
      function band(loLux, hiLux, stepLux, color) {
        ctx.beginPath();
        let first = true;
        for (let l = loLux; l <= hiLux; l += stepLux) {
          const { bri } = _LC.calc(l);
          if (first) { ctx.moveTo(lx(l), by(bri)); first = false; }
          else ctx.lineTo(lx(l), by(bri));
        }
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
      // Helper: dashed vertical riser at a discontinuity (bulb joins/leaves).
      function disc(luxAt, briTop, briBot) {
        ctx.setLineDash([2, 3]);
        ctx.beginPath();
        ctx.moveTo(lx(luxAt), by(briTop));
        ctx.lineTo(lx(luxAt), by(briBot));
        ctx.strokeStyle = '#2a2a2a';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Three bands: floor+dresser (0–250), +chest (250–500), +overheads (500–3000).
      band(0,   250,  2,  '#3e3e3e');
      disc(250, 78.7, 70.0);                 // chest joins
      band(250, 500,  4,  '#4d4d4d');
      disc(500, 85.0, 69.0);                 // overheads join
      band(500, 3000, 18, '#5c5c5c');

      // Current lux dot — hollow when lights are off/inactive
      if (currentLux != null) {
        const { bri } = _LC.calc(currentLux);
        const cx = lx(currentLux), cy = by(bri);
        const isOff = currentState === 'LOCKED_OUT' || currentState === 'HARD_OFF';
        ctx.beginPath();
        ctx.moveTo(cx, cy + 5); ctx.lineTo(cx, py + ch);
        ctx.strokeStyle = 'rgba(255,255,255,0.06)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(cx, cy, 3.5, 0, Math.PI*2);
        if (isOff) {
          ctx.strokeStyle = '#3a3a3a';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        } else {
          ctx.fillStyle = '#bfbfbf';
          ctx.fill();
        }
      }
    }

    new ResizeObserver(() => drawLuxWidget(_lastData?.lux ?? null, _lastData?.state ?? null))
      .observe(document.getElementById('lux-widget-canvas'));
    drawLuxWidget(null, null);
  </script>
</body>
</html>
