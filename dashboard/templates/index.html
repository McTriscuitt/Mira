<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mira</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0d0d0d;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 40px 32px;
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 48px;
    }

    .wordmark {
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 0.15em;
      color: #f0f0f0;
    }

    .logout {
      font-size: 12px;
      color: #555;
      text-decoration: none;
      letter-spacing: 0.05em;
    }

    .logout:hover { color: #888; }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 2px;
      margin-bottom: 48px;
    }

    .stat {
      background: #141414;
      padding: 20px 18px;
    }

    .stat-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      color: #555;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 26px;
      font-weight: 300;
      color: #e0e0e0;
    }

    .stat-value.state { font-size: 18px; letter-spacing: 0.05em; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 48px;
    }

    .btn {
      background: none;
      border: 1px solid #2a2a2a;
      color: #888;
      font-family: inherit;
      font-size: 12px;
      letter-spacing: 0.08em;
      padding: 9px 18px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .btn:hover { border-color: #555; color: #e0e0e0; }
    .btn:active { background: #1a1a1a; }

    .log-section { }

    .log-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      color: #555;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .log-list {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .log-entry {
      background: #141414;
      padding: 10px 14px;
      font-size: 13px;
      color: #888;
      display: flex;
      gap: 16px;
    }

    .log-time { color: #444; white-space: nowrap; flex-shrink: 0; }

    .stale { color: #3a3a3a; }
  </style>
</head>
<body>
  <header>
    <div class="wordmark">Mira</div>
    <a href="/logout" class="logout">logout</a>
  </header>

  <div class="status-grid">
    <div class="stat">
      <div class="stat-label">State</div>
      <div class="stat-value state" id="val-state">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Lux</div>
      <div class="stat-value" id="val-lux">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Bri</div>
      <div class="stat-value" id="val-bri">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">CT</div>
      <div class="stat-value" id="val-ct">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Overhead</div>
      <div class="stat-value" id="val-overhead">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Last seen</div>
      <div class="stat-value" id="val-ts" style="font-size:14px; padding-top:4px;">—</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" onclick="sendCommand('NORMAL')">Normal</button>
    <button class="btn" onclick="sendCommand('SOFT_PAUSE')">Soft pause</button>
    <button class="btn" onclick="sendCommand('WIND_DOWN')">Wind down</button>
    <button class="btn" onclick="sendCommand('WAKE')">Wake</button>
    <button class="btn" onclick="sendCommand('HARD_OFF')">Hard off</button>
  </div>

  <div class="log-section">
    <div class="log-label">Event log</div>
    <div class="log-list" id="log-list"></div>
  </div>

  <script>
    async function fetchStatus() {
      const response = await fetch('/api/status/latest');
      const data = await response.json();
      if (!data) return;
      document.getElementById('val-state').textContent = data.state;
      document.getElementById('val-lux').textContent = Math.round(data.lux);
      document.getElementById('val-bri').textContent = data.bri
      document.getElementById('val-ct').textContent = data.ct
      document.getElementById('val-overhead').textContent = data.overhead_on ? 'on' : 'off';
      document.getElementById('val-ts').textContent = new Date(data.timestamp).toLocaleTimeString();
    }

    async function fetchLog() {
      const response = await fetch('/api/log/recent');
      const data = await response.json();
      if (!data) return;
      document.getElementById('log-list').innerHTML = '';

      data.forEach(entry=> {
        const el = document.createElement('div');
        el.className = 'log-entry';
        el.innerHTML = `<span class="log-time">${entry.timestamp}</span><span>${entry.message}</span>`;
        document.getElementById('log-list').appendChild(el);
      });
    }

    async function sendCommand(action) {
      await fetch('/api/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action })
      });
    }
    fetchStatus();
    fetchLog();
    setInterval(fetchStatus, 30000);
    setInterval(fetchLog, 30000);
  </script>
</body>
</html>
