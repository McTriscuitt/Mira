<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mira</title>
  <meta name="csrf-token" content="{{ csrf }}">
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/legacy-dashboard.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/legacy-common.css') }}">
  <script src="{{ url_for('static', filename='js/legacy-common.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/legacy-dashboard.js') }}" defer></script>
</head>
<body>
  <div class="bg-layer" aria-hidden="true">
    <div class="bg-cone"></div>
    <span class="bg-letter">MIRA</span>
  </div>

  <main>
    <div class="status-grid">
      <div class="stat">
        <div class="stat-label">Lux</div>
        <div class="stat-value" id="val-lux">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Brightness</div>
        <div class="stat-value" id="val-bri">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Color Temperature</div>
        <div class="stat-value" id="val-ct">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Last seen</div>
        <div class="stat-value stat-value-small" id="val-ts">—</div>
      </div>
    </div>

    <div class="progress-block">
      <div class="progress-state-name" id="progress-state-name">—</div>
      <div class="progress-slider-wrap hidden" id="progress-slider-wrap">
        <input type="range" id="progress-slider" min="0" max="60" value="0" disabled aria-label="Time used">
        <span class="progress-text" id="progress-text">—</span>
        <button type="button" class="finish-btn hidden" id="extend-btn">+10 min</button>
        <button type="button" class="finish-btn hidden" id="finish-btn">finish</button>
      </div>
      <div class="progress-text" id="progress-detail"></div>
    </div>

    <div class="controls">
      <button type="button" class="btn" data-action="RESUME">Normal</button>
      <button type="button" class="btn" data-action="HOLD">Hold</button>
      <button type="button" class="btn" data-action="WAKE">Wake</button>
      <button type="button" class="btn" data-action="SLEEP" id="sleep-btn">Sleep</button>
      <button type="button" class="btn" data-action="NAP">Nap</button>
    </div>

    <div class="lights-section">
      <div class="lights-label">Lights</div>
      <div class="lights-row">
        <div class="light-chip" data-light="floor">Floor</div>
        <div class="light-chip" data-light="chest">Chest</div>
        <div class="light-chip" data-light="dresser">Dresser</div>
        <div class="light-chip" data-light="ceiling">Ceiling</div>
      </div>
    </div>

    <div class="lux-curve-section">
      <div class="lux-curve-header">
        <a href="{{ url_for('pages.legacy_lux') }}" class="lux-curve-label">Lux history</a>
      </div>
    </div>

    <div class="log-section">
      <div class="log-header">
        <a href="{{ url_for('pages.legacy_logs') }}" class="log-label">Event log</a>
      </div>
      <div class="log-list" id="log-list"></div>
    </div>

    <div class="logout-footer">
      <button type="button" class="logout" data-logout>logout</button>
    </div>
  </main>
</body>
</html>
