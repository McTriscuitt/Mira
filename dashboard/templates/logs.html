<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mira — Event Log</title>
  <meta name="csrf-token" content="{{ csrf }}">
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/legacy-logs.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/legacy-common.css') }}">
  <script src="{{ url_for('static', filename='js/legacy-common.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/legacy-logs.js') }}" defer></script>
</head>
<body>
  <main>
    <div class="page-header">
      <div class="page-title">Event log</div>
      <a href="/legacy" class="back-link">← back</a>
    </div>

    <div class="filter-row">
      <button class="filter-btn filter-active" data-search="">all</button>
      <button class="filter-btn" data-search="wake">wake</button>
      <button class="filter-btn" data-search="hold">hold</button>
      <button class="filter-btn" data-search="nap">nap</button>
      <button class="filter-btn" data-search="asleep">asleep</button>
      <button class="filter-btn" data-search="boot">boot</button>
    </div>

    <div class="log-list" id="log-list"></div>

    <div class="controls-row">
      <button class="load-more" id="load-more-btn">load more</button>
    </div>

    <div class="logout-footer">
      <button type="button" class="logout" data-logout>logout</button>
    </div>
  </main>
</body>
</html>
