<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lux curve — Mira</title>
  <meta name="csrf-token" content="{{ csrf }}">
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/legacy-lux.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/legacy-common.css') }}">
  <script src="{{ url_for('static', filename='js/legacy-common.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/legacy-lux.js') }}" defer></script>
</head>
<body>
  <nav class="page-nav">
    <a href="/legacy" class="back-link">← Mira</a>
    <span class="page-title">Lux curve</span>
  </nav>

  <div class="mode-toggle">
    <button class="mode-btn active" id="btn-curve">Curve</button>
    <button class="mode-btn" id="btn-timeline">Timeline</button>
  </div>

  <div class="canvas-wrap">
    <canvas id="lux-canvas"></canvas>
  </div>

  <div class="curve-stats">
    <div class="cs-item">
      <span class="cs-label">Lux</span>
      <span class="cs-value" id="cs-lux">—</span>
    </div>
    <div class="cs-item">
      <span class="cs-label">Brightness</span>
      <span class="cs-value" id="cs-bri">—</span>
    </div>
    <div class="cs-item">
      <span class="cs-label">Color temp</span>
      <span class="cs-value" id="cs-ct">—</span>
    </div>
    <span class="cs-live" id="cs-live"></span>
  </div>

  <div class="date-nav">
    <button class="date-btn" id="prev-day">←</button>
    <span class="date-label" id="date-display">Today</span>
    <button class="date-btn" id="next-day" disabled>→</button>
  </div>

  <div class="slider-wrap">
    <input type="range" id="tl-slider" min="0" max="0" value="0" disabled>
  </div>

  <div class="tl-info" id="tl-info">
    <span class="tl-empty">Loading…</span>
  </div>

  <div class="logout-footer">
    <button type="button" class="logout" data-logout>logout</button>
  </div>
</body>
</html>
