<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tristan DeOrnellis: software and embedded projects, presented as a terminal.">
  <meta name="theme-color" content="#0d0d0d">
  <title>Tristan DeOrnellis</title>
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tristan">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}">
  <script src="{{ url_for('static', filename='js/portfolio-content.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/terminal.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/terminal-admin.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/mira.js') }}" defer></script>
</head>
<body>
  <main class="terminal" id="terminal" data-admin="{{ '1' if admin else '0' }}" data-csrf="{{ csrf }}" data-start-dir="{{ start_dir }}">
    <div class="output" id="output" role="log" aria-live="polite" aria-label="Terminal output"></div>

    <div class="status-line" id="status-line" hidden></div>

    <form class="prompt-line" id="prompt-form" autocomplete="off" hidden>
      <label class="prompt" for="command-input"><span aria-hidden="true" id="prompt-label">~ $</span><span class="visually-hidden">Enter a command</span></label>
      <input
        id="command-input"
        class="command-input"
        type="text"
        autocapitalize="off"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
        enterkeyhint="go"
      >
    </form>

    <noscript>
      <h1>Tristan DeOrnellis</h1>
      <p>This page is a small terminal and needs JavaScript.</p>
      <p><a href="https://github.com/McTriscuitt">My projects are on GitHub.</a></p>
    </noscript>
  </main>
</body>
</html>
