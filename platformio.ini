; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` / `pio run --target upload` build only the board firmware.
default_envs = arduino_nano_esp32

[env:arduino_nano_esp32]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
lib_deps =
	adafruit/Adafruit VEML7700 Library@^2.1.6
	adafruit/Adafruit BusIO@^1.17.4
	bblanchon/ArduinoJson@^7.4.1
; The core's tests run on the host (env:native), never on the board.
test_ignore = *

; Mira 3.0 — host-side tests of the pure core (timeline + director + echo)
; through simulated days. Needs a host gcc/g++ on PATH (CLion's bundled MinGW
; works: <CLion>\bin\mingw\bin). Run: pio test -e native -e native_legs
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<timeline.cpp> +<director.cpp>
build_flags = -std=gnu++11 -Wall -Wextra -I src
test_filter = test_core

; The same core with a 30-min transition cap, so fades go out in legs — the
; fallback if the bridge rejects long durations (MIRA_3.md hardware unknown #1).
[env:native_legs]
extends = env:native
build_flags = ${env:native.build_flags} -DMAX_FADE_MS=1800000UL
test_filter = test_legs
